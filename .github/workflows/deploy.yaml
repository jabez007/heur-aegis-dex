name: Deploy Vue App to GitHub Pages

on:
  push:
    branches: # Triggers on pushes to "production" branches
      - vue
      - vue2
      - vue3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to push to the repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This job does push, but not with the credential checkout persists:
          # the Configure Git step below writes the token into the origin URL
          # itself, which is what `npm run deploy` uses. So the persisted copy
          # was never load-bearing here — it only widened the window during
          # `npm ci`, which runs first and executes dependency install scripts
          # under a `contents: write` token.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run deploy script
        run: npm run deploy
