name: Publish Package

on:
  release:
    types:
      - published

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yaml

  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pack library
        run: mkdir package && npm pack --pack-destination package

      - name: Verify packed package
        run: npm run check:package -- package/*.tgz

      - name: Preserve package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-tarball
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish_to_npm:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Trusted Publishers (OIDC)
      contents: read
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package-tarball
          path: package

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Publish to NPM
        run: npm publish package/*.tgz --provenance --access public --registry=https://registry.npmjs.org/

  publish_to_ghpr:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package-tarball
          path: package

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://npm.pkg.github.com/"
          scope: "@jabez007"

      - name: Publish to GitHub Packages
        run: npm publish package/*.tgz --access public --registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-release:
    runs-on: ubuntu-latest
    needs:
      - publish_to_npm
      - publish_to_ghpr
    permissions:
      contents: write # Required to upload assets to the release
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package-tarball
          path: package

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: package/*.tgz
          fail_on_unmatched_files: true
